<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader PRO — Scarica video YouTube in 4K</title>
    <meta name="description" content="Scarica video da YouTube fino in 4K HDR 60fps gratuitamente. Nessuna installazione richiesta.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                        <path d="M21.582 6.186a2.506 2.506 0 0 0-1.762-1.766C18.265 4 12 4 12 4s-6.264 0-7.819.42a2.506 2.506 0 0 0-1.763 1.766C2 7.74 2 12 2 12s0 4.26.418 5.814a2.506 2.506 0 0 0 1.763 1.766C5.736 20 12 20 12 20s6.265 0 7.82-.42a2.506 2.506 0 0 0 1.762-1.766C22 16.26 22 12 22 12s0-4.26-.418-5.814z" fill="#FF0000"/>
                        <path d="M10 15l5-3-5-3v6z" fill="#FFFFFF"/>
                    </svg>
                </div>
                <h1>YT Downloader <span class="badge">PRO</span></h1>
            </div>
            <p class="subtitle">Scarica i tuoi video preferiti nella massima qualità possibile, fino a <strong>4K HDR 60fps</strong></p>
        </header>

        <section class="input-section glass-panel">
            <div class="input-group">
                <div class="input-wrapper">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input type="url" id="videoUrl" placeholder="Incolla qui il link di YouTube..." required>
                </div>
                <button id="fetchBtn" class="btn-primary">
                    <span class="btn-text">Analizza</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
            <div id="errorMsg" class="error-msg hidden"></div>
        </section>

        <section id="resultSection" class="result-section glass-panel hidden">
            <div class="video-info">
                <div class="thumbnail-wrapper">
                    <img id="thumbnail" src="" alt="Thumbnail del video" class="thumbnail">
                    <div class="play-overlay">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <div class="details">
                    <h2 id="videoTitle">Titolo del Video</h2>
                    <div class="meta-row">
                        <span class="meta-badge" id="videoAuthor">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Autore
                        </span>
                    </div>
                </div>
            </div>

            <div class="download-options">
                <h3>Scegli la qualità:</h3>
                <div class="quality-grid">
                    <button class="quality-btn" data-quality="2160">
                        <div class="quality-icon">🎬</div>
                        <div class="quality-text">
                            <div class="quality-label">4K Ultra HD</div>
                            <div class="quality-desc">2160p · Massima qualità</div>
                        </div>
                    </button>
                    <button class="quality-btn" data-quality="1440">
                        <div class="quality-icon">🖥️</div>
                        <div class="quality-text">
                            <div class="quality-label">1440p QHD</div>
                            <div class="quality-desc">Ottima qualità</div>
                        </div>
                    </button>
                    <button class="quality-btn active" data-quality="1080">
                        <div class="quality-icon">📺</div>
                        <div class="quality-text">
                            <div class="quality-label">1080p Full HD</div>
                            <div class="quality-desc">Consigliato</div>
                        </div>
                    </button>
                    <button class="quality-btn" data-quality="720">
                        <div class="quality-icon">📱</div>
                        <div class="quality-text">
                            <div class="quality-label">720p HD</div>
                            <div class="quality-desc">Download veloce</div>
                        </div>
                    </button>
                </div>

                <div class="codec-selector">
                    <label class="codec-option">
                        <input type="radio" name="codec" value="h264" checked>
                        <span class="codec-label">H.264 <small>(compatibile ovunque)</small></span>
                    </label>
                    <label class="codec-option">
                        <input type="radio" name="codec" value="vp9">
                        <span class="codec-label">VP9 <small>(migliore per 4K)</small></span>
                    </label>
                    <label class="codec-option">
                        <input type="radio" name="codec" value="av1">
                        <span class="codec-label">AV1 <small>(massima efficienza)</small></span>
                    </label>
                </div>

                <button id="downloadBtn" class="btn-download">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span class="btn-text">Scarica Video</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
            <div id="downloadStatus" class="status-msg hidden"></div>
        </section>

        <footer>
            <p>Powered by <a href="https://cobalt.tools" target="_blank" rel="noopener">cobalt</a> · Open Source</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
