<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4K YouTube Downloader</title>
    <meta name="description" content="Scarica video da YouTube fino in 4K 60fps con la massima qualità.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.582 6.186a2.506 2.506 0 0 0-1.762-1.766C18.265 4 12 4 12 4s-6.264 0-7.819.42a2.506 2.506 0 0 0-1.763 1.766C2 7.74 2 12 2 12s0 4.26.418 5.814a2.506 2.506 0 0 0 1.763 1.766C5.736 20 12 20 12 20s6.265 0 7.82-.42a2.506 2.506 0 0 0 1.762-1.766C22 16.26 22 12 22 12s0-4.26-.418-5.814z" fill="#FF0000"/>
                    <path d="M10 15l5-3-5-3v6z" fill="#FFFFFF"/>
                </svg>
                <h1>YT Downloader <span class="badge">PRO</span></h1>
            </div>
            <p>Scarica i tuoi video preferiti nella massima qualità possibile, fino a 4K 60fps.</p>
        </header>

        <section class="input-section glass-panel">
            <div class="input-group">
                <input type="url" id="videoUrl" placeholder="Incolla qui il link di YouTube (es. https://youtube.com/...)" required>
                <button id="fetchBtn" class="btn-primary">
                    <span class="btn-text">Analizza</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
            <div id="errorMsg" class="error-msg hidden"></div>
        </section>

        <section id="resultSection" class="result-section glass-panel hidden">
            <div class="video-info">
                <img id="thumbnail" src="" alt="Thumbnail del video" class="thumbnail">
                <div class="details">
                    <h2 id="videoTitle">Titolo del Video</h2>
                    <p id="videoDuration">Durata: --:--</p>
                </div>
            </div>

            <div class="download-options">
                <h3>Scegli la qualità:</h3>
                <div class="quality-grid">
                    <button class="quality-btn" data-quality="4k">
                        <div class="quality-label">4K HDR</div>
                        <div class="quality-desc">Massima qualità, file grande</div>
                    </button>
                    <button class="quality-btn" data-quality="1440p">
                        <div class="quality-label">1440p</div>
                        <div class="quality-desc">Ottima qualità, file medio</div>
                    </button>
                    <button class="quality-btn active" data-quality="1080p">
                        <div class="quality-label">1080p</div>
                        <div class="quality-desc">Alta qualità, consigliato</div>
                    </button>
                    <button class="quality-btn" data-quality="720p">
                        <div class="quality-label">720p</div>
                        <div class="quality-desc">Qualità standard, veloce</div>
                    </button>
                </div>

                <button id="downloadBtn" class="btn-primary btn-large">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span class="btn-text">Scarica Video</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
            <div id="downloadStatus" class="status-msg hidden">
                Preparazione e unione del video in corso. Questo processo può richiedere alcuni minuti per video lunghi in 4K...
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
